rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Modbus TCP has no credentials.
  test-coverage: todo

  # Gold (selected)
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: The unit offers no discovery protocol (plain Modbus TCP).
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: todo
    comment: Candidate for v1.1 (filter replacement as a repair issue).
  stale-devices:
    status: exempt
    comment: One config entry maps to exactly one device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: No HTTP communication.
  strict-typing: done
